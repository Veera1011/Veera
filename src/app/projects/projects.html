<div class="cardiv">
  <mat-card class="card" *ngFor="let project of projects">
    <mat-card-header>
      <mat-card-title>{{ project.title }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>{{ project.description }}</p>
      <div class="tech-buttons">
        <button mat-button *ngFor="let tech of project.technologies" class="tech-btn">
          {{ tech }}
        </button>
      </div>
    </mat-card-content>
    <mat-card-actions>
      <a mat-button href="{{ project.link }}" target="_blank" class="view-btn">View Project</a>
    </mat-card-actions>
  </mat-card>
</div>
